name: RDP surface diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  surface:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Diagnose real native surface lifecycle
        run: pnpm exec tsx scripts/rdp-surface-smoke.ts
