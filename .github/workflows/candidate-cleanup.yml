name: Cancel superseded candidate verification
on:
  push:
    branches: ['codex/candidate-ci-cleanup']
permissions:
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const allowed = [41280855262, 41282159438];
            for (const run_id of allowed) {
              const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id });
              if (run.head_branch !== 'codex/candidate-core-0.8.18' || run.event !== 'push') throw new Error('Refusing unexpected run ' + run_id);
              if (run.status === 'completed') { core.info('Already completed: ' + run_id); continue; }
              await github.rest.actions.cancelWorkflowRun({ ...context.repo, run_id });
              core.info('Cancelled superseded candidate: ' + run_id);
            }
