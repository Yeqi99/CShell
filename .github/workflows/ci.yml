name: Windows checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:desktop
      - run: pnpm exec tsx scripts/minimal-pin-smoke.ts
      - run: pnpm exec tsx scripts/refinement-smoke.ts
      - run: pnpm exec tsx scripts/saved-connect-smoke.ts
      - run: pnpm exec tsx scripts/settings-smoke.ts
      - run: pnpm exec tsx scripts/floating-smoke.ts
      - run: pnpm exec tsx scripts/extraction-smoke.ts
      - run: pnpm run dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-preview
          path: |
            release/**/*.exe
            test-results/*.png
