name: 1.0 android candidates (no publication)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    strategy:
      fail-fast: false
      matrix:
        edition: [opensource, pro]
    runs-on: ubuntu-latest
    env:
      CSHELL_EDITION: ${{ matrix.edition }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: pnpm install --frozen-lockfile
      - run: node scripts/verify-1.0-candidate.mjs
      - run: pnpm exec tsc --noEmit -p android/web/tsconfig.json
      - run: node scripts/build-android.mjs
      - name: Restore persistent signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || { echo 'Persistent Android signing key required'; exit 1; }
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/cshell-android.p12"
      - run: gradle -p android assembleRelease lint
        env:
          ANDROID_KEYSTORE: ${{ runner.temp }}/cshell-android.p12
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: node scripts/verify-android.mjs
      - name: Stage candidate only
        run: |
          mkdir -p candidate-artifacts
          VERSION=$(node -p 'require("./package.json").version')
          cp android/app/build/outputs/apk/release/app-release.apk "candidate-artifacts/CShell-${CSHELL_EDITION}-${VERSION}-android.apk"
          sha256sum candidate-artifacts/*.apk > candidate-artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: 1.0-${{ matrix.edition }}-android-candidate
          if-no-files-found: error
          path: candidate-artifacts/*
