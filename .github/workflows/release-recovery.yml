name: Publish verified platform archives
on:
  workflow_dispatch:
    inputs:
      lane:
        required: true
        type: choice
        options: [linux, agent, mac, android, core-android]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify CI archives and upload matching release files
        env:
          GH_TOKEN: ${{ github.token }}
          LANE: ${{ inputs.lane }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          tag=cshell-pro-v1.1.4
          version=1.1.4
          case "$LANE" in
            linux) run=44326441443; sha=366447f798b543ff5088d9989ad303ccab9d1f85; pattern='^pro-linux-';;
            agent) run=44327326902; sha=e0018ba7862de9843d019cb59f00d15c237376a5; pattern='^pro-cagent-';;
            mac) run=44327505131; sha=3d907bf29c4971512825e4251f4ce09b3a2afceb; pattern='^pro-mac-';;
            android) run=44328073023; sha=814cafd78b6da111be0921107ee96c52b03364e9; pattern='^pro-android-candidate$';;
            core-android) run=44328081252; sha=ec45053078f2570bb603b89c0818c0398b8ba3d9; pattern='^core-android-candidate$'; tag=v1.0.11; version=1.0.11;;
          esac
          test "$(gh api repos/$repo/actions/runs/$run --jq .head_sha)" = "$sha"
          gh api repos/$repo/actions/runs/$run/artifacts | jq -r --arg p "$pattern" '.artifacts[] | select(.expired==false and (.name|test($p))) | [.id,.digest] | @tsv' > archives.tsv
          test -s archives.tsv
          while read -r id hash; do
            gh api repos/$repo/actions/artifacts/$id/zip > "$id.zip"
            echo "${hash#sha256:}  $id.zip" | sha256sum -c -
            unzip -q "$id.zip" -d "$id"
            count=0
            while IFS= read -r -d '' path; do
              name=$(basename "$path")
              case "$name" in
                CShell-Pro-"$version"-linux-*.deb|CShell-Pro-"$version"-linux-*.AppImage|CShell-Pro-"$version"-mac-*.zip|CAgent-"$version"-*.tar.gz|CShell-Pro-"$version"-android.apk|CShell-"$version"-android.apk) ;;
                *) continue;;
              esac
              digest=sha256:$(sha256sum "$path" | cut -d' ' -f1)
              previous=$(gh release view "$tag" -R "$repo" --json assets |jq -r --arg n "$name" '.assets[]|select(.name==$n)|.digest')
              if [ -z "$previous" ]; then gh release upload "$tag" "$path" -R "$repo"; fi
              test "$(gh release view "$tag" -R "$repo" --json assets |jq -r --arg n "$name" '.assets[]|select(.name==$n)|.digest')" = "$digest"
              echo "$name $digest"
              count=$((count+1))
            done < <(find "$id" -type f -print0)
            test "$count" -gt 0
          done < archives.tsv
