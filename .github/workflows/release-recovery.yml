name: Promote verified Pro desktop artifacts
on: workflow_dispatch
permissions:
  actions: read
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Verify workflow source and upload to draft by release ID
        shell: bash
        run: |
          set -euo pipefail
          run=44369813086
          test "$(gh api repos/$GH_REPO/actions/runs/$run --jq .head_sha)" = 918efebcef4aa1d0fffb77e985fc6356fe483568
          test "$(gh api repos/$GH_REPO/actions/runs/$run --jq .conclusion)" = success
          r=450391232
          test "$(gh api repos/$GH_REPO/releases/$r --jq .draft)" = true
          for lane in pro-mac-{arm64,x64} pro-linux-{arm64,x64}; do
            read -r id digest < <(gh api repos/$GH_REPO/actions/runs/$run/artifacts | jq -r --arg n "$lane" '.artifacts[]|select(.name==$n and .expired==false)|[.id,.digest]|@tsv')
            gh api repos/$GH_REPO/actions/artifacts/$id/zip > "$lane.zip"
            echo "${digest#sha256:}  $lane.zip" | sha256sum -c -
            unzip -q "$lane.zip" -d "$lane"
            mapfile -t files < <(find "$lane" -type f -name 'CShell-Pro-1.1.5-*')
            test "${#files[@]}" = 2
            for file in "${files[@]}"; do
              n=$(basename "$file")
              case "$n" in *.zip|*.dmg|*.deb|*.AppImage) ;; *) exit 1;; esac
              want=sha256:$(sha256sum "$file"|cut -d' ' -f1)
              old=$(gh api repos/$GH_REPO/releases/$r | jq -r --arg n "$n" '.assets[]|select(.name==$n)|.digest')
              if [ -z "$old" ]; then
                old=$(curl --fail-with-body -sS -H "Authorization: Bearer $GH_TOKEN" -H 'Content-Type: application/octet-stream' --data-binary "@$file" "https://uploads.github.com/repos/$GH_REPO/releases/$r/assets?name=$n" | jq -r .digest)
              fi
              test "$old" = "$want"
            done
          done
