name: Apple Silicon release packages
on: workflow_dispatch
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-15-intel
    timeout-minutes: 35
    env:
      CSHELL_EDITION: pro
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build and verify Apple Silicon application and update image
        shell: bash
        run: |
          set -euo pipefail
          chmod +x node_modules/node-pty/prebuilds/darwin-arm64/spawn-helper
          pnpm exec electron-builder --config electron-builder.pro.cjs --mac dir --arm64 --publish never
          root=release/pro-1.1.4
          app="$root/mac-arm64/CShell Pro.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = 1.1.4
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = org.canpshell.pro
          lipo "$app/Contents/MacOS/CShell Pro" -verify_arch arm64
          lipo "$app/Contents/Frameworks/Electron Framework.framework/Versions/A/Electron Framework" -verify_arch arm64
          pty=$(find "$app" -path '*/darwin-arm64/pty.node' -print -quit)
          test -f "$pty"; lipo "$pty" -verify_arch arm64
          test -x "$(dirname "$pty")/spawn-helper"; lipo "$(dirname "$pty")/spawn-helper" -verify_arch arm64
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          mkdir -p packages
          ditto -c -k --keepParent "$app" packages/CShell-Pro-1.1.4-mac-arm64.zip
          unzip -tq packages/CShell-Pro-1.1.4-mac-arm64.zip
          dmg=packages/CShell-Pro-1.1.4-mac-arm64.dmg
          hdiutil create -quiet -format UDZO -srcfolder "$root/mac-arm64" -volname 'CShell Pro' "$dmg"
          hdiutil verify "$dmg"
          mount=$(mktemp -d); hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          codesign --verify --deep --strict "$mount/CShell Pro.app"
          lipo "$mount/CShell Pro.app/Contents/MacOS/CShell Pro" -verify_arch arm64
          hdiutil detach "$mount"; rmdir "$mount"
      - uses: actions/upload-artifact@v4
        with:
          name: pro-mac-arm64
          path: packages/*
          if-no-files-found: error
