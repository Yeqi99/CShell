name: Verify macOS update disk images
on: workflow_dispatch
permissions:
  actions: read
  contents: write
jobs:
  dmg:
    runs-on: macos-15-intel
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      CSHELL_EDITION: pro
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - run: pnpm install --frozen-lockfile
      - name: Package verified ZIP applications for the installed update client
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          tag=cshell-pro-v1.1.4
          out=release/pro-1.1.4
          mkdir -p "$out"
          test "$(gh api repos/$repo/actions/runs/44328999198 --jq .head_sha)" = f30772356481fe860df6ab056b0452f29cb398de
          for arch in x64 arm64; do
            name="CShell-Pro-1.1.4-mac-$arch.zip"
            for i in {1..75}; do
              meta=$(gh api repos/$repo/actions/runs/44328999198/artifacts | jq -r --arg n "pro-mac-$arch" '.artifacts[]|select(.name==$n and .expired==false)|[.id,.digest]|@tsv')
              [ -n "$meta" ] && break
              sleep 30
            done
            test -n "$meta"
            read -r id digest <<< "$meta"
            gh api repos/$repo/actions/artifacts/$id/zip > "$arch-artifact.zip"
            echo "${digest#sha256:}  $arch-artifact.zip" | shasum -a 256 -c -
            unzip -q "$arch-artifact.zip" -d "$arch"
            zip=$(find "$arch" -name "$name" -type f)
            test -f "$zip"
            dir="$out/mac-$arch"; if [ "$arch" = x64 ]; then dir="$out/mac"; fi
            mkdir -p "$dir"
            ditto -x -k "$zip" "$dir"
            app="$dir/CShell Pro.app"
            codesign --verify --deep --strict "$app"
            cpu="$arch"; if [ "$arch" = x64 ]; then cpu=x86_64; fi
            lipo "$app/Contents/MacOS/CShell Pro" -verify_arch "$cpu"
            dmg="$out/CShell-Pro-1.1.4-mac-$arch.dmg"
            hdiutil create -quiet -format UDZO -srcfolder "$dir" -volname 'CShell Pro' "$dmg"
            hdiutil verify "$dmg"
            mount=$(mktemp -d); hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$mount/CShell Pro.app/Contents/Info.plist")" = 1.1.4
            codesign --verify --deep --strict "$mount/CShell Pro.app"
            hdiutil detach "$mount"; rmdir "$mount"
            if [ "$arch" = x64 ]; then pnpm exec tsx scripts/mac-update-smoke.ts; fi
            for file in "$zip" "$dmg"; do
              fname=$(basename "$file"); digest=sha256:$(shasum -a 256 "$file" | cut -d' ' -f1)
              old=$(gh release view "$tag" --json assets|jq -r --arg n "$fname" '.assets[]|select(.name==$n)|.digest')
              if [ -z "$old" ]; then gh release upload "$tag" "$file"; fi
              test "$(gh release view "$tag" --json assets|jq -r --arg n "$fname" '.assets[]|select(.name==$n)|.digest')" = "$digest"
            done
          done
