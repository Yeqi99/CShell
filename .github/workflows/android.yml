name: Android validation
on:
  push:
    paths: ['android/**', 'scripts/build-android.mjs', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'scripts/build-android.mjs', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      native:
        description: Run encrypted remote input and capture on API 29 and 35
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-android.mjs
      - run: pnpm exec tsc -p android/web/tsconfig.json
      - name: Verify bounded local file streams
        run: |
          mkdir -p "$RUNNER_TEMP/cshell-local-files"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/cshell-local-files" android/app/src/main/java/org/canpshell/mobile/LocalFileStreams.java android/app/src/test/java/org/canpshell/mobile/LocalFileStreamsTest.java
          java -cp "$RUNNER_TEMP/cshell-local-files" org.canpshell.mobile.LocalFileStreamsTest
      - run: gradle -p android assembleDebug lint
      - uses: actions/upload-artifact@v4
        with:
          name: android-validation-only
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/lint-results-debug.html

  android-native:
    if: github.event_name == 'workflow_dispatch' && inputs.native
    timeout-minutes: 35
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: pnpm install --frozen-lockfile
      - run: node scripts/prepare-pty.mjs
      - run: node scripts/build-android.mjs
      - run: gradle -p android assembleDebug assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          # Keep the isolated host-alias network used by the fixture, rather than
          # the shared Wi-Fi stack introduced in Emulator 36.5.
          # https://developer.android.com/studio/run/emulator-networking-interconnect
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -feature -WiFiPacketStream
          disable-animations: true
          script: pnpm exec tsx scripts/android-agent-instrumentation.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-android-api-${{ matrix.api }}
          path: test-results/android-*.txt
