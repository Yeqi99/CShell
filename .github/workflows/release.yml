name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish all verified packages to GitHub Releases
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: win, arch: x64 }
          - { os: macos-latest, platform: mac, arch: arm64 }
          - { os: macos-latest, platform: mac, arch: x64 }
          - { os: ubuntu-latest, platform: linux, arch: x64 }
          - { os: ubuntu-24.04-arm, platform: linux, arch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - if: matrix.platform == 'win'
        run: pnpm exec tsx scripts/ai-ui-smoke.ts
      - if: matrix.platform == 'win'
        run: pnpm exec tsx scripts/activity-smoke.ts
      - run: pnpm run licenses
      - if: matrix.platform == 'win'
        run: pnpm test:desktop
      - if: matrix.platform == 'win'
        run: pnpm exec tsx scripts/minimal-pin-smoke.ts
      - if: matrix.platform == 'win'
        run: pnpm exec tsx scripts/refinement-smoke.ts
      - if: matrix.platform == 'win'
        run: pnpm exec tsx scripts/saved-connect-smoke.ts
      - if: matrix.platform == 'win'
        run: pnpm exec tsx scripts/settings-smoke.ts
      - if: matrix.platform == 'win'
        run: pnpm exec tsx scripts/floating-smoke.ts
      - if: matrix.platform == 'win'
        run: pnpm exec tsx scripts/extraction-smoke.ts
      - if: matrix.platform == 'win'
        run: pnpm exec tsx scripts/update-smoke.ts
      - if: matrix.platform == 'win'
        run: |
          node scripts/build-android.mjs
          pnpm exec tsx scripts/mobile-smoke.ts
      - run: pnpm exec electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/*/*.exe
            release/*/*.dmg
            release/*/*.zip
            release/*/*.AppImage
            release/*/*.deb
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit -p android/web/tsconfig.json
      - run: node scripts/build-android.mjs
      - name: Restore persistent Android signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || { echo 'Persistent Android signing key required'; exit 1; }
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/cshell-android.p12"
      - run: gradle -p android assembleRelease lint
        env:
          ANDROID_KEYSTORE: ${{ runner.temp }}/cshell-android.p12
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Stage Android preview
        run: |
          mkdir -p android-artifacts
          VERSION=$(node -p 'require("./package.json").version')
          cp android/app/build/outputs/apk/release/app-release.apk "android-artifacts/CShell-${VERSION}-android-test.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-android-preview
          if-no-files-found: error
          path: android-artifacts/*.apk
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: desktop-*
          merge-multiple: true
      - name: Verify version and checksum artifacts
        run: |
          node -e 'if (process.env.GITHUB_REF_TYPE === "tag" && "v"+require("./package.json").version !== process.env.GITHUB_REF_NAME) process.exit(1)'
          mkdir packages
          find artifacts -type f -exec cp {} packages/ \;
          test "$(find packages -type f | wc -l)" -eq 10
          cd packages
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v$(node -p 'require("./package.json").version')"
          gh release create "$VERSION" packages/* --target "$GITHUB_SHA" --title "CShell $VERSION" --notes-file docs/RELEASE.md --prerelease
