name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish all verified packages to GitHub Releases
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: win, arch: x64 }
          - { os: macos-latest, platform: mac, arch: arm64 }
          - { os: macos-15-intel, platform: mac, arch: x64 }
          - { os: ubuntu-latest, platform: linux, arch: x64 }
          - { os: ubuntu-24.04-arm, platform: linux, arch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare the native PTY dependency for this runner
        run: node scripts/prepare-pty.mjs
      - run: pnpm build
      - run: pnpm test
      - if: matrix.platform == 'win'
        run: pnpm exec tsx scripts/ai-ui-smoke.ts
      - if: matrix.platform == 'win'
        name: Verify settings preview and layout update convergence
        run: pnpm exec tsx scripts/settings-preview-race-smoke.ts
      - if: matrix.platform == 'win'
        name: Verify terminal parser UI update convergence
        run: pnpm exec tsx scripts/terminal-parsed-race-smoke.ts
      - if: matrix.platform == 'win'
        run: pnpm exec tsx scripts/activity-smoke.ts
      - if: matrix.platform == 'win'
        name: Verify OpenCode catalog and hidden terminal layout
        run: |
          pnpm exec tsx scripts/opencode-catalog-smoke.ts
          pnpm exec tsx scripts/terminal-measurement-smoke.ts
          pnpm exec tsx scripts/ssh-visual-activity-smoke.ts
      - if: matrix.platform == 'win'
        name: Verify compact workbench and desktop layouts
        run: |
          pnpm exec tsx scripts/workbench-layout-smoke.ts
          pnpm exec tsx scripts/monitor-layout-smoke.ts
          pnpm exec tsx scripts/opencode-pane-smoke.ts
          pnpm exec tsx scripts/desktop-compact-ui-smoke.ts
          pnpm exec tsx scripts/monitor-views-smoke.ts
          pnpm exec tsx scripts/monitor-ai-electron-smoke.ts
          pnpm exec tsx scripts/ai-view-smoke.ts
      - run: pnpm run licenses
      - if: matrix.platform == 'win'
        name: Prepare checksum-pinned desktop compiler
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'llvm-mingw.zip'
          Invoke-WebRequest 'https://github.com/mstorsjo/llvm-mingw/releases/download/20261006/llvm-mingw-20261006-ucrt-x86_64.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '317492c456aa27ee607a5919f1d2d38dcdc1112516a24d0bf4b00d078f52d17a') { throw 'Compiler checksum mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP
          "CAGENT_NATIVE_CXX=$env:RUNNER_TEMP/llvm-mingw-20261006-ucrt-x86_64/bin/x86_64-w64-mingw32-clang++.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Build the standalone Agent without Electron
        run: node scripts/agent-build.mjs
      - name: Verify the packaged Agent with a real native terminal
        run: pnpm exec tsx scripts/agent-package-smoke.ts
      - run: node scripts/package-agent.mjs
      - if: matrix.platform == 'win'
        run: pnpm test:desktop
      - if: matrix.platform == 'win'
        run: pnpm exec tsx scripts/minimal-pin-smoke.ts
      - if: matrix.platform == 'win'
        run: pnpm exec tsx scripts/refinement-smoke.ts
      - if: matrix.platform == 'win'
        run: pnpm exec tsx scripts/saved-connect-smoke.ts
      - if: matrix.platform == 'win'
        run: pnpm exec tsx scripts/connection-lifecycle-smoke.ts
      - if: matrix.platform == 'win'
        run: pnpm exec tsx scripts/ai-work-smoke.ts
      - if: matrix.platform == 'win'
        run: pnpm exec tsx scripts/ai-exit-smoke.ts
      - if: matrix.platform == 'win'
        run: ./scripts/windows-shortcut-smoke.ps1
      - if: matrix.platform == 'win'
        run: pnpm exec tsx scripts/mcp-startup-smoke.ts
      - if: matrix.platform == 'win'
        run: pnpm exec tsx scripts/settings-smoke.ts
      - if: matrix.platform == 'win'
        run: pnpm exec tsx scripts/floating-smoke.ts
      - if: matrix.platform == 'win'
        run: pnpm exec tsx scripts/extraction-smoke.ts
      - if: matrix.platform == 'win'
        run: pnpm exec tsx scripts/update-smoke.ts
      - if: matrix.platform == 'win'
        run: pnpm exec tsx scripts/http-agent-smoke.ts
      - if: matrix.platform == 'win'
        run: |
          node scripts/build-android.mjs
          pnpm exec tsx scripts/mobile-smoke.ts
          pnpm exec tsx scripts/mobile-apps-smoke.ts
          pnpm exec tsx scripts/mobile-app-lifecycle-smoke.ts
          pnpm exec tsx scripts/mobile-ssh-workspace-smoke.ts
          pnpm exec tsx scripts/browser-lifecycle-smoke.ts
          pnpm exec tsx scripts/ide-launch-smoke.ts
      - run: pnpm exec electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - if: matrix.platform == 'mac'
        name: Verify in-place DMG update
        run: pnpm exec tsx scripts/mac-update-smoke.ts
      - if: matrix.platform == 'mac'
        name: Verify CAgent desktop viewer on macOS
        run: |
          pnpm exec playwright install chromium
          pnpm exec tsx scripts/desktop-view-race-smoke.ts
          pnpm exec tsx scripts/desktop-fullscreen-smoke.ts
          pnpm exec tsx scripts/desktop-compact-ui-smoke.ts
      - if: matrix.platform != 'linux'
        run: pnpm exec tsx scripts/platform-package-smoke.ts
      - if: matrix.platform == 'linux'
        name: Verify packaged Linux application on its native architecture
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb gnome-keyring libsecret-1-0 libsecret-tools
          dbus-run-session -- xvfb-run -a bash scripts/linux-package-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.platform }}-${{ matrix.arch }}
          path: test-results/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/*/*.exe
            release/*/*.dmg
            release/*/*.zip
            release/*/*.AppImage
            release/*/*.deb
            release/*/CAgent-*.tar.gz
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit -p android/web/tsconfig.json
      - run: node scripts/build-android.mjs
      - name: Restore persistent Android signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || { echo 'Persistent Android signing key required'; exit 1; }
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/cshell-android.p12"
      - run: gradle -p android assembleRelease lint
        env:
          ANDROID_KEYSTORE: ${{ runner.temp }}/cshell-android.p12
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Stage Android preview
        run: |
          node scripts/verify-android.mjs
          mkdir -p android-artifacts
          VERSION=$(node -p 'require("./package.json").version')
          cp android/app/build/outputs/apk/release/app-release.apk "android-artifacts/CShell-${VERSION}-android-test.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-android-preview
          if-no-files-found: error
          path: android-artifacts/*.apk
  android-native:
    needs: android
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: pnpm install --frozen-lockfile
      - run: node scripts/prepare-pty.mjs
      - run: node scripts/build-android.mjs
      - run: gradle -p android assembleDebug assembleDebugAndroidTest
      - uses: actions/download-artifact@v4
        with:
          name: desktop-android-preview
          path: signed-android
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          CSHELL_ANDROID_RELEASE_DIR: signed-android
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          # Keep the isolated host-alias network used by the fixture, rather than
          # the shared Wi-Fi stack introduced in Emulator 36.5.
          # https://developer.android.com/studio/run/emulator-networking-interconnect
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -feature -WiFiPacketStream
          disable-animations: true
          script: pnpm exec tsx scripts/android-agent-instrumentation.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-android-api-${{ matrix.api }}
          path: test-results/android-*.txt
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    needs: [desktop, android, android-native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: desktop-*
          merge-multiple: false
      - name: Verify version and checksum artifacts
        run: pnpm exec tsx scripts/release-assets.ts artifacts packages
      - name: Upload draft, verify every asset, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          CSHELL_RELEASE_SHA: ${{ github.sha }}
        run: |
          VERSION="v$(node -p 'require("./package.json").version')"
          gh release create "$VERSION" packages/* --target "$GITHUB_SHA" --title "CShell $VERSION" --notes-file docs/RELEASE.md --prerelease --draft
          node scripts/verify-release-upload.mjs packages
          gh release edit "$VERSION" --draft=false
