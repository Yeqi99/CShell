name: Core Android candidate
on:
  push:
    branches: ['codex/candidate-core-0.8.20']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    env:
      CSHELL_EDITION: opensource
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit -p android/web/tsconfig.json
      - name: Restore verified native VPN libraries from the previous signed APK
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 'https://shell.canp.ai/downloads/opensource/v1.0.10/CShell-1.0.10-android.apk' -o "$RUNNER_TEMP/previous.apk"
          echo '63ac0c6976f22b3183050693f171a59b223b84042b743f7d62b53e63a2c94e40  PLACEHOLDER' | sed "s|PLACEHOLDER|$RUNNER_TEMP/previous.apk|" | sha256sum -c -
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            target="android/app/src/main/jniLibs/$abi"
            mkdir -p "$target"
            unzip -p "$RUNNER_TEMP/previous.apk" "lib/$abi/libhev-socks5-tunnel.so" > "$target/libhev-socks5-tunnel.so"
            readelf -h "$target/libhev-socks5-tunnel.so" >/dev/null
          done
          mkdir -p android/app/src/main/assets
          unzip -p "$RUNNER_TEMP/previous.apk" assets/VPN_THIRD_PARTY_NOTICES.txt > android/app/src/main/assets/VPN_THIRD_PARTY_NOTICES.txt
      - run: node scripts/build-android.mjs
      - name: Restore persistent signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || { echo 'Persistent Android signing key required'; exit 1; }
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/cshell-android.p12"
      - run: gradle -p android assembleRelease lint
        env:
          ANDROID_KEYSTORE: ${{ runner.temp }}/cshell-android.p12
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: node scripts/verify-android.mjs
      - name: Stage candidate only
        run: |
          mkdir -p candidate-artifacts
          VERSION=$(node -p 'require("./package.json").version')
          cp android/app/build/outputs/apk/release/app-release.apk "candidate-artifacts/CShell-${VERSION}-android.apk"
          sha256sum candidate-artifacts/*.apk > candidate-artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: core-android-candidate
          if-no-files-found: error
          path: candidate-artifacts/*
