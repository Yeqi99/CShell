<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>邀请与礼品卡 · CShell</title><link rel="stylesheet" href="rewards.css"><main><header><img src="../icon.svg" width="32" height="32" alt=""> CShell</header><div class="layout"><section><h1 id="title">邀请与礼品卡</h1><p id="intro"></p><canvas hidden width="840" height="1040" aria-label="可保存的扫码海报"></canvas><button id="save" hidden>保存 PNG 图片</button></section><section class="panel"><form id="auth"><h2>账号</h2><label>邮箱<input required type="email" name="email" autocomplete="email"></label><label>密码<input required type="password" name="password" minlength="8" maxlength="128" autocomplete="current-password"></label><label id="codeRow" hidden>邮箱验证码<input name="code" inputmode="numeric" maxlength="6"><button type="button" id="send">获取验证码</button></label><button id="submit">登录</button><button type="button" id="toggle">注册账号</button></form><div hidden id="account"><h2 id="identity"></h2><p id="stats"></p><button id="mine">我的邀请海报</button><div id="offers"></div><form id="redeem"><label>礼品卡兑换码<input name="code" required autocomplete="off" maxlength="32"></label><button>兑换礼品卡</button></form><details><summary>点数明细</summary><ul id="ledger"></ul></details><button id="logout">退出账号</button></div><p id="status" role="status" aria-live="polite"></p></section></div></main><script src="qrcode.js"></script><script src="rewards.js" type="module"></script></html>
