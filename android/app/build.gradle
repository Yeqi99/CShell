plugins { id 'com.android.application' }
def releaseVersion = new groovy.json.JsonSlurper().parse(file('../../package.json')).version
if (!(releaseVersion ==~ /\d+\.\d+\.\d+/)) throw new GradleException('Invalid package.json version')
def versionParts = releaseVersion.tokenize('.').collect { it.toInteger() }
if (versionParts.any { it > 999 }) throw new GradleException('Version components must be <= 999')
def proEdition = System.getenv('CSHELL_EDITION') == 'pro'
def releaseCode = versionParts[0] * 1000000 + versionParts[1] * 1000 + versionParts[2]
android {
    namespace 'org.canpshell.mobile'
    compileSdk 36
    defaultConfig { applicationId (proEdition ? 'org.canpshell.mobile.pro' : 'org.canpshell.mobile'); manifestPlaceholders = [appLabel: proEdition ? 'CShell Pro' : 'CShell']; minSdk 26; targetSdk 36; versionCode releaseCode; versionName releaseVersion; testInstrumentationRunner 'org.canpshell.mobile.AgentProtocolTest' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            if (System.getenv('ANDROID_KEYSTORE')) {
                storeFile file(System.getenv('ANDROID_KEYSTORE'))
                storePassword System.getenv('ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
}
dependencies {
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'com.github.mwiede:jsch:2.28.8'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.86'
}
